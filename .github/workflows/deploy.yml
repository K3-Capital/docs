name: Build and deploy docs.k3.capital

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-source-updated]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      # Concurrent builds collapse into the newest one: a build is a pure function of
      # the source `main` branches, so a superseded build has nothing to publish.
      # Pull-request validation keeps its own per-PR group, so a push to a PR can only
      # cancel other validation runs — never a production build.
      #
      # Only the build is cancellable. The deploy job has its own, non-cancellable
      # group below, so a build that has already handed its artifact to a running
      # deployment is never interrupted.
      group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'docs-pages-build' }}
      cancel-in-progress: true
    steps:
      - name: Checkout portal repository
        uses: actions/checkout@v6

      - name: Validate the dispatch source
        # Two independent checks, and the payload is only read after the caller is known.
        #
        # `github.event.sender.login` is the authenticated identity of the App whose
        # installation token created the dispatch — the dispatcher App's bot user. The
        # payload's `repository` is supplied by the caller and can name any repository it
        # likes, so on its own it is a claim, not a credential: this step runs before any
        # source is checked out, so an unexpected caller is rejected before the build is
        # initialised rather than after.
        #
        # Both values are attacker-influenced data read from the event, so they travel
        # through `env:` and are validated by a script — never interpolated into a `run:`
        # shell script.
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_SENDER: ${{ github.event.sender.login }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: node scripts/validate-dispatch-source.mjs

      - name: Checkout vault documentation source
        uses: actions/checkout@v6
        with:
          repository: K3-Capital/k3-vault-docs
          ref: main
          path: vendor/k3-vault-docs

      - name: Checkout sBOLD documentation source
        uses: actions/checkout@v6
        with:
          repository: K3-Capital/sBOLT-docs
          ref: main
          path: vendor/sBOLT-docs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            vendor/k3-vault-docs/package-lock.json
            vendor/sBOLT-docs/package-lock.json

      - name: Record documentation source revisions
        # Dispatch payload values are attacker-influenced data, and this workflow runs
        # with a token that can deploy Pages. They are passed through `env:` and read as
        # shell variables instead of being interpolated into the script, so shell
        # metacharacters in the payload can never be executed.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
        run: |
          echo "vault docs source: $(git -C vendor/k3-vault-docs rev-parse HEAD)"
          echo "sBOLD docs source: $(git -C vendor/sBOLT-docs rev-parse HEAD)"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "dispatch payload repository: $DISPATCH_REPOSITORY"
            echo "dispatch payload sha:        $DISPATCH_SHA"
          fi

      - name: Run portal unit tests
        run: npm test

      - name: Build documentation sources and assemble the site
        run: scripts/build-site.sh

      - name: Summarise the assembled artifact
        run: |
          echo "pages: $(find _site -name '*.html' | wc -l)"
          echo "vault pages: $(find _site/vault-infra -name '*.html' | wc -l)"
          echo "sBOLD pages: $(find _site/sBOLT -name '*.html' | wc -l)"
          ls -la _site

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Deployments are serialised and never cancelled: a rebuild that arrives while a
      # deployment is publishing queues behind it instead of interrupting it.
      group: docs-pages-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
